#version: '3.8'

services:
  backend:
    build: .
    container_name: hybrid_rag_backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  frontend:
    build: .
    container_name: hybrid_rag_frontend
    command: streamlit run Frontend/Frontend.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: always